name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every build in this workflow is cgo-free. That is not an optimisation; it is
  # the property the project claims, so it is what CI exercises.
  CGO_ENABLED: "0"

jobs:
  # ---------------------------------------------------------------------------
  # Formatting, vetting, and the dependency-purity check that guards the core's
  # headline promise.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and dependency purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            backend/gg/go.sum
            backend/gg/gpu/go.sum
            backend/window/go.sum
            arrow/v18/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          (cd backend/gg && go vet ./...)
          (cd backend/gg/gpu && go vet ./...)
          (cd backend/window && go vet ./...)
          (cd arrow/v18 && go vet ./...)

      - name: The core module must depend on nothing but the standard library
        run: |
          # A nested module is excluded from its parent's module graph, so this
          # is a real invariant rather than a hope. See docs/adr/0001.
          extra="$(go list -deps ./... | grep -v '^github.com/timzifer/refract' | grep '\.' || true)"
          if [ -n "$extra" ]; then
            echo "The core module has picked up non-stdlib dependencies:"
            echo "$extra"
            exit 1
          fi
          echo "core dependency graph is stdlib-only"

  # ---------------------------------------------------------------------------
  # Tests on every supported platform and on the declared minimum toolchain.
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [stable]
        include:
          # go.mod declares 1.25; check that the declaration is true rather than
          # aspirational.
          - os: ubuntu-latest
            go: "1.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            backend/gg/go.sum
            backend/gg/gpu/go.sum
            backend/window/go.sum
            arrow/v18/go.sum

      - name: Build
        run: |
          go build ./...
          go build ./backend/gg/...
          go build ./backend/gg/gpu/...
          go build ./backend/window/...
          go build ./arrow/v18/...

      - name: Test the core
        run: go test ./...

      - name: Test the gg backend
        working-directory: backend/gg
        run: go test ./...

      # The window layer cannot be opened on a runner with no display, so what
      # runs here is everything that is not the window: the input conversions
      # and the seams. The window itself is compiled on every platform above
      # and cross-compiled below. See docs/adr/0021.
      - name: Test the window backend
        working-directory: backend/window
        run: go test ./...

      # The GPU tier registers an accelerator that a runner has no device for.
      # The test asserts the property that has to hold either way: a chart
      # renders, and it renders the same chart. See docs/adr/0022.
      - name: Test the GPU tier
        working-directory: backend/gg/gpu
        run: go test ./...

      - name: Test the Arrow adapter
        working-directory: arrow/v18
        run: go test ./...

  # ---------------------------------------------------------------------------
  # The race detector needs cgo, so it gets its own job rather than weakening
  # the cgo-free guarantee everything else is built under.
  # ---------------------------------------------------------------------------
  race:
    name: Race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            backend/gg/go.sum
            backend/gg/gpu/go.sum
            backend/window/go.sum
            arrow/v18/go.sum

      - name: Test the core
        run: go test -race ./...

      - name: Test the gg backend
        working-directory: backend/gg
        run: go test -race ./...

      - name: Test the window backend
        working-directory: backend/window
        run: go test -race ./...

      - name: Test the Arrow adapter
        working-directory: arrow/v18
        run: go test -race ./...

  # ---------------------------------------------------------------------------
  # Cross-compilation. Being cgo-free is only worth claiming if it is checked.
  # ---------------------------------------------------------------------------
  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            backend/gg/go.sum
            backend/gg/gpu/go.sum
            backend/window/go.sum
            arrow/v18/go.sum

      - name: Build the core for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

      - name: Build the gg backend for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./backend/gg/...

      - name: Build the window backend for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./backend/window/...

      # The GPU tier is the one thing here that does not build for the browser:
      # gg/gpu reaches wgpu's native core, which has no js target. That is a
      # property of the tier rather than an oversight — the browser draws on a
      # canvas 2D context (docs/adr/0017) — so it is checked everywhere else and
      # skipped there.
      - name: Build the GPU tier for ${{ matrix.goos }}/${{ matrix.goarch }}
        if: matrix.goos != 'js'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./backend/gg/gpu/...

      - name: Build the Arrow adapter for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./arrow/v18/...

  # ---------------------------------------------------------------------------
  # The browser backend. Cross-compiling it is not enough: backend/canvas talks
  # to a canvas 2D context through syscall/js, and the only way to know it asks
  # for the right things is to run it. Node provides the JS side, and the tests
  # supply a recording context — see backend/canvas/canvas_js_test.go.
  # ---------------------------------------------------------------------------
  wasm:
    name: Browser backend (js/wasm)
    runs-on: ubuntu-latest
    env:
      GOOS: js
      GOARCH: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            backend/gg/go.sum
            backend/gg/gpu/go.sum
            backend/window/go.sum
            arrow/v18/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # go test finds the wasm exec wrapper on PATH, which is how it knows how
      # to run a js/wasm test binary under node.
      - name: Put the wasm exec wrapper on PATH
        run: echo "$(go env GOROOT)/lib/wasm" >> "$GITHUB_PATH"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./backend/canvas/...

      - name: Build the browser example
        run: go build -o /tmp/chart.wasm ./examples/web

  # ---------------------------------------------------------------------------
  # Benchmarks, and the gate they exist for. CONCEPT.md §11 promises that a
  # frame's cost in allocations does not grow with the data it draws; this is
  # where that is checked on every commit, from real benchmark output rather
  # than from a claim.
  #
  # Running every benchmark also keeps them from rotting: a benchmark nobody
  # runs is a benchmark that stops compiling.
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmarks and the allocation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            backend/gg/go.sum
            backend/gg/gpu/go.sum
            backend/window/go.sum
            arrow/v18/go.sum

      # The gate's own tests. They live behind //go:build !race because the
      # race detector allocates on refract's behalf, so they are invisible to
      # the race job and need running here.
      - name: The allocation gate as a test
        run: go test -count=1 -run 'AllocatePerPoint|AllocationBudget' -v .

      # -benchtime=10x, because this job gates allocation counts — which are
      # deterministic — and not times, which a shared runner cannot measure.
      # -benchmem, so that every line carries the bytes and the allocations
      # whether or not the benchmark asked for them itself.
      - name: Run every benchmark
        run: |
          set -euo pipefail
          {
            go test -run='^$' -bench=. -benchmem -benchtime=10x -count=1 ./...
            (cd backend/gg && go test -run='^$' -bench=. -benchmem -benchtime=10x -count=1 ./...)
            (cd backend/window && go test -run='^$' -bench=. -benchmem -benchtime=10x -count=1 ./...)
            (cd arrow/v18 && go test -run='^$' -bench=. -benchmem -benchtime=10x -count=1 ./...)
          } | tee bench.txt

      - name: The allocation gate as a benchmark
        run: awk -f .github/scripts/allocgate.awk bench.txt

      # The suite is public: the raw output is attached to the run, and the
      # same table docs/benchmarks.md carries is written into the job summary.
      # The times in it are this runner's and mean nothing across runs — the
      # summary says so, and the gate above is what holds.
      - name: Summarise
        if: always()
        run: |
          {
            echo "### Benchmarks"
            echo
            echo "The allocation columns are gated; the times are this runner's and are not comparable across runs. See docs/benchmarks.md."
            echo
            awk -f .github/scripts/benchtable.awk bench.txt || echo "no benchmark output"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks
          path: bench.txt

  # ---------------------------------------------------------------------------
  # Coverage across both modules, published as a shields.io endpoint so the
  # README badge needs no third-party service.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            backend/gg/go.sum
            backend/gg/gpu/go.sum
            backend/window/go.sum
            arrow/v18/go.sum

      - name: Measure
        run: |
          set -euo pipefail
          # -coverpkg makes a package count as covered when another package's
          # tests exercise it, which is what actually happens in a library laid out
          # in layers: theme and ir are used by every render, not called directly
          # by their own tests.
          go test -covermode=atomic -coverpkg=./... -coverprofile=core.cov ./...
          (cd backend/gg && go test -covermode=atomic -coverpkg=./...,github.com/timzifer/refract/... -coverprofile=../../gg.cov ./...)
          (cd backend/window && go test -covermode=atomic -coverpkg=./...,github.com/timzifer/refract/... -coverprofile=../../window.cov ./...)
          (cd arrow/v18 && go test -covermode=atomic -coverpkg=./...,github.com/timzifer/refract/... -coverprofile=../../arrow.cov ./...)

          # Merge the profiles: one mode line, then every data line from each.
          { echo "mode: atomic"; tail -q -n +2 core.cov gg.cov window.cov arrow.cov; } > coverage.cov
          go tool cover -func=coverage.cov | tail -n 1 | tee coverage-total.txt

      - name: Write the badge endpoint
        run: |
          set -euo pipefail
          pct="$(awk '{gsub(/%/,"",$NF); print $NF}' coverage-total.txt)"
          echo "total coverage: ${pct}%"

          # shields.io's own thresholds, so the colour means what readers expect.
          color=red
          awk -v p="$pct" 'BEGIN { exit !(p >= 50) }' && color=orange
          awk -v p="$pct" 'BEGIN { exit !(p >= 70) }' && color=yellow
          awk -v p="$pct" 'BEGIN { exit !(p >= 80) }' && color=green
          awk -v p="$pct" 'BEGIN { exit !(p >= 90) }' && color=brightgreen

          mkdir -p docs
          cat > docs/coverage.json <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${pct}%",
            "color": "${color}"
          }
          EOF
          cat docs/coverage.json

      - name: Summarise
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            go tool cover -func=coverage.cov | tail -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.cov
            docs/coverage.json

      - name: Commit the badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/coverage.json; then
            echo "coverage unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/coverage.json
          git commit -m "ci: update the coverage badge"
          git push

  # ---------------------------------------------------------------------------
  # The documentation figures. Every chart in the README is generated code
  # output, so it is checked like any other generated artefact: regenerate,
  # compare, fail on a difference — and on main, commit the new renders.
  # ---------------------------------------------------------------------------
  figures:
    name: Documentation figures
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            backend/gg/go.sum
            backend/gg/gpu/go.sum
            backend/window/go.sum
            arrow/v18/go.sum

      - name: Check the committed figures against the code
        id: check
        continue-on-error: true
        run: go run ./backend/gg/cmd/gallery -check

      - name: Re-render
        if: steps.check.outcome == 'failure'
        run: go run ./backend/gg/cmd/gallery

      # On a pull request a stale figure is a failure the author fixes: the
      # regenerated images are attached so the change can be looked at.
      - name: Publish the re-rendered figures for review
        if: steps.check.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rerendered-figures
          path: docs/images/

      - name: Fail the pull request on stale figures
        if: steps.check.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::error::The committed figures no longer match the code."
          echo "Run 'go run ./backend/gg/cmd/gallery' and commit docs/images/."
          echo "The re-rendered images are attached to this run as an artifact."
          exit 1

      # On main the figures are simply brought back in line.
      - name: Commit the re-rendered figures
        if: steps.check.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git commit -m "ci: re-render the documentation figures"
          git push
